name: Publish multi-platform docker images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+[0-9a-z]+'
      - 'v*-blake2b.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

      repository-name:
        description: 'Docker repository name'
        default: 'ghcr.io/privkeyio'
        required: false

      platforms-to-build:
        description: 'List of platforms to build'
        default: 'linux/amd64,linux/arm64'
        required: false
  
      push-latest:
        description: 'Push the latest tag also?'
        default: 'false'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false    # Let each tag finish.
      matrix:
        include:
          - target: lightningd
            tag_suffix: ''

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.inputs.version || github.ref }}  # The release being built, or the tag that triggered it
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up values for ${{ matrix.target }}
      id: set-values
      env:
        INPUT_VERSION: ${{ github.event.inputs.version }}
        INPUT_REPONAME: ${{ github.event.inputs.repository-name }}
        INPUT_PLATFORMS: ${{ github.event.inputs.platforms-to-build }}
        INPUT_PUSH_LATEST: ${{ github.event.inputs.push-latest }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        TAG_SUFFIX: ${{ matrix.tag_suffix }}
      run: |
        if [[ "$INPUT_VERSION" != "" ]]; then
          echo "Input version provided"
          VERSION="$INPUT_VERSION"
        elif [[ "$REF_TYPE" == "tag" ]]; then
          echo "This is a tag event"
          VERSION="$REF_NAME"
        else
          echo "No version provided and no tag found."
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

        if [[ "$INPUT_REPONAME" != "" ]]; then
          REPONAME="$INPUT_REPONAME"
        else
          REPONAME="ghcr.io/privkeyio"
        fi
        echo "REPONAME=$REPONAME" >> "$GITHUB_ENV"

        if [[ "$INPUT_PLATFORMS" != "" ]]; then
          PLATFORMS="$INPUT_PLATFORMS"
        else
          PLATFORMS="linux/amd64,linux/arm64"
        fi
        echo "PLATFORMS=$PLATFORMS" >> "$GITHUB_ENV"

        # Only a release tag (vX.Y.Z-blake2b.N) moves latest; rc and test tags never do.
        if [[ "$INPUT_PUSH_LATEST" == "true" ]] ||
          ([[ "$REF_TYPE" == "tag" ]] && [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-blake2b\.[0-9]+$ ]]); then
          echo "Latest true"
          PUSHLATEST="true"
        else
          echo "Latest false"
          PUSHLATEST="false"
        fi
        echo "PUSHLATEST=$PUSHLATEST" >> "$GITHUB_ENV"

        TAGS="$REPONAME/lightningd:$VERSION$TAG_SUFFIX"
        if [[ "$PUSHLATEST" == "true" ]]; then
          TAGS="$TAGS,$REPONAME/lightningd:latest$TAG_SUFFIX"
        fi
        echo "TAGS=$TAGS" >> "$GITHUB_ENV"

    - name: Print GitHub Ref Values
      env:
        TARGET: ${{ matrix.target }}
        TAG_SUFFIX: ${{ matrix.tag_suffix }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        echo "TARGET: $TARGET"
        echo "TAG SUFFIX: $TAG_SUFFIX"
        echo "GITHUB REF TYPE: $REF_TYPE"
        echo "GITHUB REF NAME: $REF_NAME"
        echo "VERSION: $VERSION"
        echo "REPO NAME: $REPONAME"
        echo "PLATFORMS: $PLATFORMS"
        echo "PUSH LATEST: $PUSHLATEST"
        echo "TAGS: $TAGS"

    - name: Build and push Docker tag - ${{ env.TAGS }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        target: ${{ matrix.target }}
        push: true
        platforms: ${{ env.PLATFORMS }}
        tags: ${{ env.TAGS }}
        build-args: |
          VERSION=${{ env.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
